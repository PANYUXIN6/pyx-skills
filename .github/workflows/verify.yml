name: Verify skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python3 -m unittest discover -s evals/tests -p 'test_*.py'
      - run: node --test review-design-contracts/scripts/review-design.test.mjs
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
